name: Update CEYPETCO Fuel Prices

on:
  schedule:
    # Daily at 11:50 PM Sri Lanka Time (UTC+05:30) = 18:20 UTC
    - cron: "20 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fuel-prices
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -v

      - name: Fetch, reconcile, and validate fuel prices
        run: python -m scripts.update_fuel_prices --verbose

      - name: Check for CSV, KPI, or sync status changes
        id: changes
        run: |
          if git diff --quiet -- cpc_petroleum_prices_original.csv data/current_rates.json data/archive_meta.json data/trends_kpis.json data/monthly_aggregated.json data/annual_aggregated.json data/pipeline_status.json && [ -z "$(git ls-files --others --exclude-standard -- data/current_rates.json data/archive_meta.json data/trends_kpis.json data/monthly_aggregated.json data/annual_aggregated.json data/pipeline_status.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No CSV, KPI, or sync changes detected; skipping commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated fuel data
        if: steps.changes.outputs.changed == 'true'
        run: |
          UPDATE_DATE=$(TZ="Asia/Colombo" date +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cpc_petroleum_prices_original.csv data/current_rates.json data/archive_meta.json data/trends_kpis.json data/monthly_aggregated.json data/annual_aggregated.json data/pipeline_status.json
          if git diff --cached --quiet; then
            echo "Nothing staged to commit."
            exit 0
          fi
          git commit -m "chore(data): update fuel prices for ${UPDATE_DATE}"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 2
          done
          exit 1
